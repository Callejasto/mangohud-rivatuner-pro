################################################################################
#  MangoHud — Overlay estilo "RivaTuner Pro"       Setup: GPU NVIDIA + CPU AMD
#  Copiar a:  ~/.config/MangoHud/MangoHud.conf
#  Por juego: ~/.config/MangoHud/<ejecutable>.conf  (ej. cyberpunk2077.exe.conf)
#  Activar:   mangohud %command%   (Steam)   ·   MANGOHUD=1 ./juego   (terminal)
################################################################################

### ---------- Diseño general ----------
legacy_layout=0            # respeta el orden en que aparecen los parámetros aquí
position=top-right
offset_x=12
offset_y=12
round_corners=10
width=330
table_columns=3
background_alpha=0.55
background_color=0E121C   # fondo azul-grafito oscuro del panel
alpha=1.0
text_outline=1
text_outline_color=000000
text_outline_thickness=1.2
font_size=24      # ver sección "Escalado por resolución" al final
font_scale=1.0
toggle_hud=Shift_R+F12
toggle_fps_limit=Shift_L+F1
fps_sampling_period=250    # ms — mismo refresco que la maqueta HTML

### ---------- Bloque FPS (arriba, protagonista) ----------
fps
fps_color_change            # verde / ámbar / rojo según el valor
fps_value=60,120            # umbrales: <60 rojo, 60-120 ámbar, >120 verde
fps_color=FF5252,FFB84D,4ADE80
show_fps_limit
engine_version              # Vulkan / OpenGL / DXVK / VKD3D — equivalente al "DLSS/FSR" informativo
engine_color=A8FF00
present_mode                # VSync / Mailbox / Immediate
frame_timing=1              # gráfica de frametime (la "línea en el tiempo")
frametime_color=60A5FA
histogram=0                 # 1 = barras en vez de línea

### ---------- Bloque GPU (color NVIDIA) ----------
gpu_name
gpu_text=NVIDIA GPU
gpu_color=76B900
gpu_stats
gpu_temp
gpu_junction_temp           # hotspot (AMD) — útil para el margen térmico
gpu_core_clock
gpu_mem_clock
gpu_power
gpu_voltage
gpu_fan
gpu_load_change             # el % de carga cambia de color como la barra térmica
gpu_load_value=60,90
gpu_load_color=4ADE80,FBBF24,EF4444
vram
vram_color=A8FF00
throttling_status           # ⚠ muestra si la GPU está en throttling térmico/potencia

### ---------- Bloque CPU (color AMD) ----------
cpu_text=AMD CPU
cpu_color=ED1C24
cpu_stats
cpu_temp
cpu_power
cpu_mhz
cpu_load_change
cpu_load_value=60,90
cpu_load_color=4ADE80,FBBF24,EF4444
# core_load                 # descomenta para ver cada núcleo

### ---------- Bloque sistema (neutral) ----------
ram
ram_color=CBD5E1
swap
io_read
io_write
io_color=94A3B8

### ---------- Gráficas de área de fondo (carga GPU / CPU) ----------
graphs=gpu_load,cpu_load    # equivalente a las gráficas rellenas detrás de cada bloque
# graphs=gpu_load,cpu_load,gpu_temp,vram   # más gráficas si quieres

### ---------- Métricas del pie: AVG FPS · 1% LOW · 0.1% LOW ----------
fps_metrics=avg,0.01,0.001

### ---------- Upscaler / Frame Generation ----------
# MangoHud NO puede leer el estado de DLSS/FSR/XeSS ni de Frame Generation
# desde dentro del juego (eso lo expone solo el driver / el propio juego).
# Lo que sí puede mostrar:
#   fsr                     -> estado y sharpness de FSR cuando el juego corre bajo gamescope
#   hdr                     -> estado HDR bajo gamescope
#   refresh_rate            -> Hz del monitor
# Se deja una etiqueta fija con la tecnología típica de esta GPU:
custom_text=DLSS 3.5 / DLSS FG
fsr
refresh_rate

### ---------- Extras ----------
gamemode                    # indica si Feral GameMode está activo
vkbasalt
wine                        # versión de Wine/Proton
wine_color=CBD5E1
media_player=0

################################################################################
#  Escalado por resolución (MangoHud no auto-escala; ajusta font_size):
#     1080p  -> font_size=20   width=280
#     1440p  -> font_size=24   width=330   (valor por defecto de este archivo)
#     2160p  -> font_size=36   width=480
#     Ultrawide: usa el valor de su ALTO (3440x1440 -> 1440p)
#  También puedes dejar font_size y variar font_scale=0.8 / 1.5 por juego.
################################################################################
